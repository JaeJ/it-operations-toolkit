name: Toolkit Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser

      - name: Analyze Toolkit Scripts
        shell: pwsh
        run: |

          $Results = Invoke-ScriptAnalyzer `
              -Path ./modules `
              -Recurse

          if ($Results) {

              Write-Host "Analyzer Results:"
              $Results | Format-Table -AutoSize

          }

          $Errors = $Results |
              Where-Object { $_.Severity -eq "Error" }

          if ($Errors) {

              throw "PSScriptAnalyzer detected one or more errors."

          }

      - name: Run Pester Tests
        shell: pwsh
        run: |

          $TestResults = Invoke-Pester `
              -Path "./tests" `
              -Passthru

          if ($TestResults.FailedCount -gt 0) {

              throw "$($TestResults.FailedCount) test(s) failed."

          }

      - name: Validate Module Completeness
        shell: pwsh
        run: |

          $Modules = Get-ChildItem `
              -Path "./modules" `
              -Directory

          foreach ($Module in $Modules) {

              $ModulePath = $Module.FullName

              if (-not (Test-Path "$ModulePath/README.md")) {
                  throw "$($Module.Name) missing README.md"
              }

              if (-not (Test-Path "$ModulePath/CHANGELOG.md")) {
                  throw "$($Module.Name) missing CHANGELOG.md"
              }

              if (-not (Test-Path "$ModulePath/docs")) {
                  throw "$($Module.Name) missing docs folder"
              }

              if (-not (Test-Path "$ModulePath/examples")) {
                  throw "$($Module.Name) missing examples folder"
              }

              if (-not (Test-Path "$ModulePath/scripts")) {
                  throw "$($Module.Name) missing scripts folder"
              }

              if (-not (Test-Path "$ModulePath/tests")) {
                  throw "$($Module.Name) missing tests folder"
              }
          }

      - name: Validation Complete
        shell: pwsh
        run: |
          Write-Host "Toolkit validation completed successfully."